<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none">
  <!-- Left-aligned Icon Mark -->
  <g transform="translate(4, 2)">
    <!-- 4-Color Base / Road Accent -->
    <rect x="13" y="53" width="6" height="2.5" rx="1.25" fill="#4285F4" />
    <rect x="21" y="53" width="6" height="2.5" rx="1.25" fill="#EA4335" />
    <rect x="29" y="53" width="6" height="2.5" rx="1.25" fill="#FBBC05" />
    <rect x="37" y="53" width="6" height="2.5" rx="1.25" fill="#34A853" />

    <!-- Eco Leaf / Swoosh Accent (Google Green) -->
    <path d="M33 40 C37 35 46.5 25.5 49.5 12 C41 13.5 34 22 31 29 C29.5 32.5 31.5 37.5 33 40 Z" fill="#34A853" />
    <path d="M33.5 38.5 C36.5 32 43 23 48.5 14" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity="0.65" />

    <!-- Pin Body (Google Blue) with Subtle Outline -->
    <path d="M28 7 C36.284 7 43 13.716 43 22 C43 31.2 34 40.5 28 49 C22 40.5 13 31.2 13 22 C13 13.716 19.716 7 28 7 Z" fill="#4285F4" stroke="#1A73E8" stroke-width="1.2" stroke-linejoin="round" />

    <!-- Person Silhouette (Inside Pin, High-Contrast White) -->
    <circle cx="28" cy="17.5" r="3.75" fill="#FFFFFF" />
    <path d="M20.5 29.5 C21 25.2 24.2 23.5 28 23.5 C31.8 23.5 35 25.2 35.5 29.5 C33.4 32 28 33 28 33 C28 33 22.6 32 20.5 29.5 Z" fill="#FFFFFF" />
  </g>

  <!-- Wordmark CIVIC HERO -->
  <text x="74" y="34" font-family="'Roboto', 'Google Sans', -apple-system, sans-serif" font-weight="700" font-size="24" letter-spacing="-0.5">
    <tspan fill="#202124">CIVIC</tspan> <tspan fill="#4285F4">HERO</tspan>
  </text>

  <!-- Tagline CHANGE YOUR CITY. -->
  <text x="74" y="52" font-family="'Roboto', 'Google Sans', -apple-system, sans-serif" font-weight="500" font-size="10.5" letter-spacing="2.4" fill="#5F6368">
    CHANGE YOUR CITY.
  </text>
</svg>