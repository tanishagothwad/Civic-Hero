    <script>
      // Ensure canonical trailing slash on /Civic-Hero
      if (window.location.pathname === '/Civic-Hero') {
        window.history.replaceState(null, '', '/Civic-Hero/' + window.location.search + window.location.hash);
      }
      // Cleanly unregister any legacy service workers and clear caches
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var reg of registrations) {
            reg.unregister();
          }
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (var name of names) {
            caches.delete(name);
          }
        });
      }
    </script>
