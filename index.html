  <body class="bg-[#F8F9FA] text-[#202124] antialiased selection:bg-[#4285F4] selection:text-white font-sans">
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
    <script>
      // Cleanly unregister any legacy service workers and clear caches
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var reg of registrations) {
            reg.unregister();
          }
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (var name of names) {
            caches.delete(name);
          }
        });
      }
    </script>
  </body>
