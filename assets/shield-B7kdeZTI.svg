<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#0B132B" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="230" stroke="#10B981" stroke-opacity="0.15" stroke-width="4" fill="none" />

  <!-- Outer Glowing Shield -->
  <path d="M256 70 L395 125 V260 C395 355 256 442 256 442 C256 442 117 355 117 260 V125 L256 70 Z" 
        fill="url(#shieldGrad)" filter="url(#shadow)" />

  <!-- Inner Dark Shield Inset -->
  <path d="M256 94 L372 140 V252 C372 333 256 410 256 410 C256 410 140 333 140 252 V140 L256 94 Z" 
        fill="#0B132B" fill-opacity="0.92" />

  <!-- Gold Star / Crown at the Top -->
  <polygon points="256,128 266,158 298,158 272,176 282,206 256,188 230,206 240,176 214,158 246,158" 
           fill="url(#goldGrad)" />

  <!-- Checkmark / Hero Symbol in Center -->
  <path d="M196 268 L238 310 L320 220" 
        stroke="url(#goldGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Subtle City Skyline Inset -->
  <path d="M175 320 H195 V295 H215 V320 H240 V285 H260 V320 H285 V290 H305 V320 H337" 
        stroke="#10B981" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.4" fill="none"/>
</svg>
